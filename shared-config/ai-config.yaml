embedding:
  model: sentence-transformers/all-MiniLM-L6-v2
  version: 1
  dimensions: 384

vector_store:
  provider: qdrant
  host: qdrant
  port: 6333
  collection: psc_knowledge

retrieval:
  candidate_k: 20
  final_k: 6
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2

llm:
  provider: local
  model: llama3.1:8b
  host: llm-server
  port: 11434

chunking:
  strategy: recursive
  chunk_size: 500
  chunk_overlap: 50
