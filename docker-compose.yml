services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: psc_chatbot
      POSTGRES_USER: psc
      POSTGRES_PASSWORD: psc_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psc"]
      interval: 5s
      timeout: 5s
      retries: 5

  llm-server:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      # Default is 5 minutes — on CPU-only hardware, reloading the model
      # from disk costs ~80s, so keep it resident for longer idle gaps.
      OLLAMA_KEEP_ALIVE: 60m

  rag-service:
    build: ./rag-service
    ports:
      - "8000:8000"
    volumes:
      - ./shared-config:/shared-config:ro
    environment:
      SHARED_CONFIG_PATH: /shared-config/ai-config.yaml
    depends_on:
      - qdrant
      - llm-server

  ingestion-worker:
    build: ./ingestion-worker
    volumes:
      - ./shared-config:/shared-config:ro
      - uploads_data:/service/uploads
    environment:
      SHARED_CONFIG_PATH: /shared-config/ai-config.yaml
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
      DATABASE_URL: postgresql://psc:psc_dev_password@postgres:5432/psc_chatbot
    depends_on:
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy

  chatbot-backend:
    build: ./chatbot-backend
    ports:
      - "3001:3001"
    volumes:
      - uploads_data:/app/uploads
    environment:
      PORT: 3001
      FRONTEND_URL: http://localhost:5173
      ADMIN_PORTAL_URL: http://localhost:5175
      RAG_SERVICE_URL: http://rag-service:8000
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
      WORKER_UPLOADS_DIR: /service/uploads
      DATABASE_URL: postgresql://psc:psc_dev_password@postgres:5432/psc_chatbot
      JWT_SECRET: dev-only-insecure-secret-change-for-real-deployments
      JWT_EXPIRES_IN: 8h
    depends_on:
      rag-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  admin-portal:
    build:
      context: ./admin-portal
      args:
        VITE_ADMIN_API_URL: http://localhost:3001
    ports:
      - "5175:80"
    depends_on:
      - chatbot-backend

volumes:
  qdrant_data:
  ollama_data:
  uploads_data:
  postgres_data:
